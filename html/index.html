<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Device Control</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }

      h1 {
        color: #2d3748;
        font-size: 24px;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .subtitle {
        color: #718096;
        font-size: 14px;
        margin-bottom: 40px;
      }

      .toggle-wrapper {
        margin: 40px 0;
      }

      .toggle-btn {
        position: relative;
        width: 80px;
        height: 40px;
        background: #cbd5e0;
        border-radius: 40px;
        border: none;
        cursor: pointer;
        transition: background 0.3s ease;
        display: inline-block;
      }

      .toggle-btn.active {
        background: #48bb78;
      }

      .toggle-btn::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 32px;
        height: 32px;
        background: white;
        border-radius: 50%;
        transition: transform 0.3s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .toggle-btn.active::after {
        transform: translateX(40px);
      }

      .status {
        margin-top: 30px;
        padding: 16px;
        background: #f7fafc;
        border-radius: 12px;
        border-left: 4px solid #cbd5e0;
        transition: border-color 0.3s ease;
      }

      .status.active {
        border-left-color: #48bb78;
      }

      .status-label {
        font-size: 12px;
        color: #718096;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }

      .status-value {
        font-size: 20px;
        font-weight: 600;
        color: #2d3748;
      }

      .status-value.active {
        color: #48bb78;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Device Control</h1>
      <p class="subtitle">IoT Toggle Interface</p>

      <div class="toggle-wrapper">
        <button
          id="toggle"
          class="toggle-btn"
          aria-label="Toggle device"
        ></button>
      </div>

      <div id="status" class="status">
        <div class="status-label">Status</div>
        <div id="statusValue" class="status-value">OFF</div>
      </div>
    </div>

    <script>
      const toggle = document.getElementById("toggle");
      const status = document.getElementById("status");
      const statusValue = document.getElementById("statusValue");

      function updateUI(isOn) {
        if (isOn) {
          toggle.classList.add("active");
          status.classList.add("active");
          statusValue.classList.add("active");
          statusValue.textContent = "ON";
        } else {
          toggle.classList.remove("active");
          status.classList.remove("active");
          statusValue.classList.remove("active");
          statusValue.textContent = "OFF";
        }
      }

      // Ask ESP32 for real LED state
      function fetchLedState() {
        fetch("/led_state")
          .then((r) => r.text())
          .then((state) => updateUI(state === "ON"));
      }

      // Toggle LED on ESP32
      toggle.onclick = () => {
        fetch("/led", { method: "POST" }).then(() => fetchLedState());
      };

      // Initial sync
      fetchLedState();

      // Keep UI in sync with physical button
      setInterval(fetchLedState, 100);
    </script>
